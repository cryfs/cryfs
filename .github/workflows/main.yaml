name: CI
on:
  # Only the long-lived branches build on push. A branch that exists to carry a pull
  # request is already built by the pull_request trigger below, and an unfiltered push
  # trigger meant every such commit was built twice: once as the branch head, once as
  # the merge with the base. Tags stay listed so release tags still get a build.
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
      - 'feature/**'
    tags:
      - '**'
  pull_request:

# One run per ref at a time. On a branch carrying a pull request, a new commit
# cancels the run of the one it replaces, so a fix-up push doesn't have to wait behind
# the superseded run. Without that, runs for commits that no longer exist kept
# occupying the queue and reporting failures long after the branch had moved on.
#
# The release branches are exempt, because that is where this project's code lives and
# a run there is worth finishing: it is the one that refreshes the ccache and conan
# caches from the real branch state, and its packaging job is the only build of what
# actually ships. While merges arrive more often than a run takes, cancelling means no
# run ever reaches those steps.
#
# The group still keeps a release branch to one run at a time, and holds one pending
# run behind it: further merges replace whatever is pending rather than queueing up, so
# the run that starts next covers the newest commit at that moment. The cost is that
# results lag by up to the length of a run, and a commit that was only ever the pending
# one gets no run of its own. Same setting the Rust workflow uses for main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  should_run:
    # A push to a branch that has an open pull request is already built by that
    # pull request's run (the merge with the base), so the push run would build
    # the same commit a second time. This job checks for such a pull request,
    # and every other job skips when it finds one. It decides only for push
    # events on branches; tag pushes and pull_request events always run.
    name: Skip pushes already built by a pull request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      os_list: ${{ steps.matrix.outputs.os_list }}
    steps:
      - name: Decide which runners this event builds on
        id: matrix
        # A pull request builds every Linux runner and one macOS runner; a push
        # to a release branch or a tag builds all of them. The account gets five
        # concurrent macOS runners, and with thirteen macOS jobs per run they
        # were the bulk of the queue by job count.
        #
        # macos-15 is the one kept, because what macOS adds over Linux is the
        # Darwin platform rather than a compiler version, and the Linux runners
        # already build clang 13 to 19 and gcc 9 to 14 on every pull request.
        # Of the two dropped, macos-15-intel is x86_64, the architecture the
        # Linux runners cover thoroughly, and macos-26 is a second Darwin SDK
        # behind the same architecture as macos-15. Neither is a combination
        # only macOS can show, and a release branch keeps both.
        #
        # This is the os axis alone. The build types, the compiler list and the
        # exclusions that say which compiler exists on which runner are the same
        # for both events, so a dropped runner takes its exclusions with it and
        # they simply match nothing.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          full='["macos-15","macos-15-intel","macos-26"]'
          pr='["macos-15","macos-15-intel","macos-26"]'
          if [[ "$EVENT" == "pull_request" ]]; then
            os_list="$pr"
          else
            os_list="$full"
          fi
          # A malformed list fails every job with an unhelpful message, so check
          # it here where the error is readable.
          echo "$os_list" | python3 -m json.tool > /dev/null
          echo "os_list=$os_list" >> "$GITHUB_OUTPUT"
      - name: Look for an open pull request from this branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" != "push" || "$REF_TYPE" != "branch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only pull requests whose head lives in this repository count: a
          # fork could carry a branch of the same name, and its pull request
          # builds the fork's commit, not ours.
          prs=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number,headRepositoryOwner \
            --jq "[.[] | select(.headRepositoryOwner.login == \"$OWNER\")] | length")
          if [[ "$prs" == "0" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Branch $BRANCH has an open pull request; its run builds this commit."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  linux_macos:
    name: CI
    needs: should_run
    if: needs.should_run.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        name: [""]
        # Which runners this is depends on the event; see should_run above.
        os: ${{ fromJSON(needs.should_run.outputs.os_list) }}
        # Every build type of a configuration is built and tested in the same
        # job, one after another, so the job pays for the runner, the checkout
        # and the compiler installation once instead of once per build type.
        # Space-separated; the build, test and package steps below run once
        # per build type named here.
        build_types: ["Debug Release RelWithDebInfo"]
        compiler:
          - compiler: clang
            version: 19
            libcxx: libc++
            cc: clang-19
            cxx: clang++-19
            macos_cc: llvm@19/bin/clang
            macos_cxx: llvm@19/bin/clang++
            apt_package: clang-19 libc++-19-dev libc++abi-19-dev libunwind-19-dev libomp-19-dev
            homebrew_package: llvm@19
          # Apple Clang
#           - compiler: apple-clang
#             version: xxx
#             homebrew_package: ""
        extra_conan_flags: [""]
        extra_cxxflags: ['[]']
        extra_env_vars_for_test: [""]
        install_dependencies_manually: [false]
        # Whether to build the test binaries, as conan's True or False. The
        # packaging job builds what it ships, which is without them. Every
        # other job wants them, either to run them or to compile them under
        # the check it exists for.
        build_tests: ["True"]
        run_build: [true]
        run_tests: [false]
        run_cpack: [false]
        run_clang_tidy: [false]
        gtest_args: [""]
        exclude:
          # MacOS 15 doesn't have Clang 13 anymore. And GCC versions are often incompatible, so we don't support them officially.
          - os: macos-15
            compiler: {compiler: clang, version: 13, libcxx: libc++, cc: clang-13, cxx: clang++-13, macos_cc: llvm@13/bin/clang, macos_cxx: llvm@13/bin/clang++, apt_package: "clang-13 libc++-13-dev libc++abi-13-dev libunwind-13-dev libomp-13-dev", homebrew_package: llvm@13}
          - os: macos-15
            compiler: {compiler: gcc, version: 9, libcxx: libstdc++11, cc: gcc-9, cxx: g++-9, homebrew_package: gcc@9, apt_package: g++-9}
          - os: macos-15
            compiler: {compiler: gcc, version: 10, libcxx: libstdc++11, cc: gcc-10, cxx: g++-10, homebrew_package: gcc@10, apt_package: g++-10}
          - os: macos-15
            compiler: {compiler: gcc, version: 11, libcxx: libstdc++11, cc: gcc-11, cxx: g++-11, homebrew_package: gcc@11, apt_package: g++-11}
          - os: macos-15
            compiler: {compiler: gcc, version: 12, libcxx: libstdc++11, cc: gcc-12, cxx: g++-12, homebrew_package: gcc@12, apt_package: g++-12}
          - os: macos-15
            compiler: {compiler: gcc, version: 13, libcxx: libstdc++11, cc: gcc-13, cxx: g++-13, homebrew_package: gcc@13, apt_package: g++-13}
          - os: macos-15
            compiler: {compiler: gcc, version: 14, libcxx: libstdc++11, cc: gcc-14, cxx: g++-14, homebrew_package: gcc@14, apt_package: g++-14}
          - os: macos-15
            compiler: {compiler: gcc, version: 15, libcxx: libstdc++11, cc: gcc-15, cxx: g++-15, homebrew_package: gcc@15, apt_package: g++-15}
          - os: macos-15-intel
            compiler: {compiler: clang, version: 13, libcxx: libc++, cc: clang-13, cxx: clang++-13, macos_cc: llvm@13/bin/clang, macos_cxx: llvm@13/bin/clang++, apt_package: "clang-13 libc++-13-dev libc++abi-13-dev libunwind-13-dev libomp-13-dev", homebrew_package: llvm@13}
          - os: macos-15-intel
            compiler: {compiler: clang, version: 18, libcxx: libc++, cc: clang-18, cxx: clang++-18, macos_cc: llvm@18/bin/clang, macos_cxx: llvm@18/bin/clang++, apt_package: "clang-18 libc++-18-dev libc++abi-18-dev libunwind-18-dev libomp-18-dev", homebrew_package: llvm@18}
          - os: macos-15-intel
            compiler: {compiler: gcc, version: 9, libcxx: libstdc++11, cc: gcc-9, cxx: g++-9, homebrew_package: gcc@9, apt_package: g++-9}
          - os: macos-15-intel
            compiler: {compiler: gcc, version: 10, libcxx: libstdc++11, cc: gcc-10, cxx: g++-10, homebrew_package: gcc@10, apt_package: g++-10}
          - os: macos-15-intel
            compiler: {compiler: gcc, version: 11, libcxx: libstdc++11, cc: gcc-11, cxx: g++-11, homebrew_package: gcc@11, apt_package: g++-11}
          - os: macos-15-intel
            compiler: {compiler: gcc, version: 12, libcxx: libstdc++11, cc: gcc-12, cxx: g++-12, homebrew_package: gcc@12, apt_package: g++-12}
          - os: macos-15-intel
            compiler: {compiler: gcc, version: 13, libcxx: libstdc++11, cc: gcc-13, cxx: g++-13, homebrew_package: gcc@13, apt_package: g++-13}
          - os: macos-15-intel
            compiler: {compiler: gcc, version: 14, libcxx: libstdc++11, cc: gcc-14, cxx: g++-14, homebrew_package: gcc@14, apt_package: g++-14}
          - os: macos-15-intel
            compiler: {compiler: gcc, version: 15, libcxx: libstdc++11, cc: gcc-15, cxx: g++-15, homebrew_package: gcc@15, apt_package: g++-15}
          # MacOS 15-intel fails to build with Clang 14
          - os: macos-15-intel
            compiler: {compiler: clang, version: 14, libcxx: libc++, cc: clang-14, cxx: clang++-14, macos_cc: llvm@14/bin/clang, macos_cxx: llvm@14/bin/clang++, apt_package: "clang-14 libc++-14-dev libc++abi-14-dev libunwind-14-dev libomp-14-dev", homebrew_package: llvm@14}
          # MacOS 15-intel fails to install Clang 16
          - os: macos-15-intel
            compiler: {compiler: clang, version: 16, libcxx: libc++, cc: clang-16, cxx: clang++-16, macos_cc: llvm@16/bin/clang, macos_cxx: llvm@16/bin/clang++, apt_package: "clang-16 libc++-16-dev libc++abi-16-dev libunwind-16-dev libomp-16-dev", homebrew_package: llvm@16}
          # MacOS 26 doesn't have Clang 13, 14, 15 anymore. And GCC versions are often incompatible, so we don't support them officially.
          - os: macos-26
            compiler: {compiler: clang, version: 13, libcxx: libc++, cc: clang-13, cxx: clang++-13, macos_cc: llvm@13/bin/clang, macos_cxx: llvm@13/bin/clang++, apt_package: "clang-13 libc++-13-dev libc++abi-13-dev libunwind-13-dev libomp-13-dev", homebrew_package: llvm@13}
          - os: macos-26
            compiler: {compiler: clang, version: 14, libcxx: libc++, cc: clang-14, cxx: clang++-14, macos_cc: llvm@14/bin/clang, macos_cxx: llvm@14/bin/clang++, apt_package: "clang-14 libc++-14-dev libc++abi-14-dev libunwind-14-dev libomp-14-dev", homebrew_package: llvm@14}
          - os: macos-26
            compiler: {compiler: clang, version: 15, libcxx: libc++, cc: clang-15, cxx: clang++-15, macos_cc: llvm@15/bin/clang, macos_cxx: llvm@15/bin/clang++, apt_package: "clang-15 libc++-15-dev libc++abi-15-dev libunwind-15-dev libomp-15-dev", homebrew_package: llvm@15}
          - os: macos-26
            compiler: {compiler: gcc, version: 9, libcxx: libstdc++11, cc: gcc-9, cxx: g++-9, homebrew_package: gcc@9, apt_package: g++-9}
          - os: macos-26
            compiler: {compiler: gcc, version: 10, libcxx: libstdc++11, cc: gcc-10, cxx: g++-10, homebrew_package: gcc@10, apt_package: g++-10}
          - os: macos-26
            compiler: {compiler: gcc, version: 11, libcxx: libstdc++11, cc: gcc-11, cxx: g++-11, homebrew_package: gcc@11, apt_package: g++-11}
          - os: macos-26
            compiler: {compiler: gcc, version: 12, libcxx: libstdc++11, cc: gcc-12, cxx: g++-12, homebrew_package: gcc@12, apt_package: g++-12}
          - os: macos-26
            compiler: {compiler: gcc, version: 13, libcxx: libstdc++11, cc: gcc-13, cxx: g++-13, homebrew_package: gcc@13, apt_package: g++-13}
          - os: macos-26
            compiler: {compiler: gcc, version: 14, libcxx: libstdc++11, cc: gcc-14, cxx: g++-14, homebrew_package: gcc@14, apt_package: g++-14}
          - os: macos-26
            compiler: {compiler: gcc, version: 15, libcxx: libstdc++11, cc: gcc-15, cxx: g++-15, homebrew_package: gcc@15, apt_package: g++-15}
          # Ubuntu 22.04 doesn't have gcc 13, 14 or 15
          - os: ubuntu-22.04
            compiler: {compiler: gcc, version: 13, libcxx: libstdc++11, cc: gcc-13, cxx: g++-13, homebrew_package: gcc@13, apt_package: g++-13}
          - os: ubuntu-22.04
            compiler: {compiler: gcc, version: 14, libcxx: libstdc++11, cc: gcc-14, cxx: g++-14, homebrew_package: gcc@14, apt_package: g++-14}
          - os: ubuntu-22.04
            compiler: {compiler: gcc, version: 15, libcxx: libstdc++11, cc: gcc-15, cxx: g++-15, homebrew_package: gcc@15, apt_package: g++-15}
          # Ubuntu 24.04 doesn't have gcc 15, and doesn't have clang 13 anymore
          - os: ubuntu-24.04
            compiler: {compiler: gcc, version: 15, libcxx: libstdc++11, cc: gcc-15, cxx: g++-15, homebrew_package: gcc@15, apt_package: g++-15}
          - os: ubuntu-24.04
            compiler: {compiler: clang, version: 13, libcxx: libc++, cc: clang-13, cxx: clang++-13, macos_cc: llvm@13/bin/clang, macos_cxx: llvm@13/bin/clang++, apt_package: "clang-13 libc++-13-dev libc++abi-13-dev libunwind-13-dev libomp-13-dev", homebrew_package: llvm@13}
          # Ubuntu 26.04 has neither clang 13 to 16 nor gcc 9 and 10 anymore
          - os: ubuntu-26.04
            compiler: {compiler: clang, version: 13, libcxx: libc++, cc: clang-13, cxx: clang++-13, macos_cc: llvm@13/bin/clang, macos_cxx: llvm@13/bin/clang++, apt_package: "clang-13 libc++-13-dev libc++abi-13-dev libunwind-13-dev libomp-13-dev", homebrew_package: llvm@13}
          - os: ubuntu-26.04
            compiler: {compiler: clang, version: 14, libcxx: libc++, cc: clang-14, cxx: clang++-14, macos_cc: llvm@14/bin/clang, macos_cxx: llvm@14/bin/clang++, apt_package: "clang-14 libc++-14-dev libc++abi-14-dev libunwind-14-dev libomp-14-dev", homebrew_package: llvm@14}
          - os: ubuntu-26.04
            compiler: {compiler: clang, version: 15, libcxx: libc++, cc: clang-15, cxx: clang++-15, macos_cc: llvm@15/bin/clang, macos_cxx: llvm@15/bin/clang++, apt_package: "clang-15 libc++-15-dev libc++abi-15-dev libunwind-15-dev libomp-15-dev", homebrew_package: llvm@15}
          - os: ubuntu-26.04
            compiler: {compiler: clang, version: 16, libcxx: libc++, cc: clang-16, cxx: clang++-16, macos_cc: llvm@16/bin/clang, macos_cxx: llvm@16/bin/clang++, apt_package: "clang-16 libc++-16-dev libc++abi-16-dev libunwind-16-dev libomp-16-dev", homebrew_package: llvm@16}
          - os: ubuntu-26.04
            compiler: {compiler: gcc, version: 9, libcxx: libstdc++11, cc: gcc-9, cxx: g++-9, homebrew_package: gcc@9, apt_package: g++-9}
          - os: ubuntu-26.04
            compiler: {compiler: gcc, version: 10, libcxx: libstdc++11, cc: gcc-10, cxx: g++-10, homebrew_package: gcc@10, apt_package: g++-10}
    runs-on: ${{matrix.os}}
    env:
      # Setting conan cache dir to a location where our Github Cache Action can find it
      CONAN_HOME: "${{ github.workspace }}/conan-cache/"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch all history because we need that to determine our version number
          fetch-depth: 0
      #TODO Ideally, all the setup actions would be in their own subaction, but Github doesn't support using third party actions (e.g. cache) from nested actions yet, see https://github.com/actions/runner/issues/862
      - name: Setup MacOS
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/workflows/actions/setup_macos
        with:
          macos_version: ${{ matrix.os }}
          extra_homebrew_packages: ${{ matrix.compiler.homebrew_package }}
      - name: Setup Linux
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/workflows/actions/setup_linux
        with:
          os: ${{ matrix.os }}
          extra_apt_packages: ${{ matrix.compiler.apt_package }}
          llvm_version: ${{ matrix.compiler.compiler == 'clang' && matrix.compiler.version || '' }}
      - name: Install local dependencies
        if: ${{ matrix.install_dependencies_manually }}
        uses: ./.github/workflows/actions/install_local_dependencies
      #TODO Ideally, the Setup ccache step would be part of the build action, but Github doesn't support nested actions yet, see https://github.com/actions/runner/issues/862
      - name: Hash flags
        id: hash_flags
        shell: bash
        run: |
          echo __${{matrix.extra_conan_flags}}__${{matrix.extra_cxxflags}}__ | (echo -n "hash_flags=" && sha256sum | awk '{print $1}') >> $GITHUB_OUTPUT
      - name: Build types
        id: build_types
        shell: bash
        env:
          BUILD_TYPES: ${{ matrix.build_types }}
        # `slug` joins the build types with dashes for the cache keys, `first`
        # is the one the conan profile is written with; every conan command
        # below names its build type explicitly anyway.
        run: |
          echo "slug=${BUILD_TYPES// /-}" >> "$GITHUB_OUTPUT"
          echo "first=${BUILD_TYPES%% *}" >> "$GITHUB_OUTPUT"
      - name: Setup ccache
        uses: ./.github/workflows/actions/ccache/setup
        with:
          ccache_dir: ${{github.workspace}}/.ccache
          cache_key: v4-${{ runner.os }}-${{ matrix.os }}-ccache__${{matrix.compiler.compiler}}__${{matrix.compiler.version}}__${{steps.build_types.outputs.slug}}__${{matrix.run_build}}__${{matrix.install_dependencies_manually}}__${{matrix.run_clang_tidy}}__${{steps.hash_flags.outputs.hash_flags}}__
      # TODO Ideally, the Setup conan cache step would be part of the build action, but Github doesn't support nested actions yet, see https://github.com/actions/runner/issues/862
      - name: Restore conan cache
        uses: ./.github/workflows/actions/conan/cache
        with:
          action: load
          cache_key: v11-${{ runner.os }}-${{ matrix.os }}-conancache__${{matrix.compiler.compiler}}__${{matrix.compiler.version}}__${{steps.build_types.outputs.slug}}__${{matrix.install_dependencies_manually}}__${{steps.hash_flags.outputs.hash_flags}}__
      # Setup conan is after restoring the cache so the cache doesn't overwrite the conan profile
      - name: Setup conan
        uses: ./.github/workflows/actions/conan/setup
        with:
          arch: ${{ (matrix.os == 'macos-15' || matrix.os == 'macos-26') && 'armv8' || 'x86_64' }}
          compiler: ${{ matrix.compiler.compiler }}
          compiler_version: ${{ matrix.compiler.version }}
          compiler_libcxx: ${{ matrix.compiler.libcxx }}
          compiler_executable_c: ${{ runner.os == 'macOS' && format('{0}{1}', (matrix.os == 'macos-15-intel' && '/usr/local/opt/' || '/opt/homebrew/opt/'), matrix.compiler.macos_cc) || matrix.compiler.cc }}
          compiler_executable_cxx: ${{ runner.os == 'macOS' && format('{0}{1}', (matrix.os == 'macos-15-intel' && '/usr/local/opt/' || '/opt/homebrew/opt/'), matrix.compiler.macos_cxx) || matrix.compiler.cxx }}
          build_type: ${{ steps.build_types.outputs.first }}
          extra_cxxflags: ${{ matrix.extra_cxxflags }}
      - name: Install dependencies (Debug)
        if: ${{ !matrix.install_dependencies_manually && contains(matrix.build_types, 'Debug') }}
        uses: ./.github/workflows/actions/conan/install_dependencies
        with:
          build_type: Debug
          build_tests: ${{ matrix.build_tests }}
      - name: Build (Debug)
        if: ${{ matrix.run_build && !matrix.install_dependencies_manually && contains(matrix.build_types, 'Debug') }}
        uses: ./.github/workflows/actions/conan/build
        with:
          build_type: Debug
          build_tests: ${{ matrix.build_tests }}
          extra_conan_flags: ${{ matrix.extra_conan_flags}}
      - name: Install dependencies (Release)
        if: ${{ !matrix.install_dependencies_manually && contains(matrix.build_types, 'Release') }}
        uses: ./.github/workflows/actions/conan/install_dependencies
        with:
          build_type: Release
          build_tests: ${{ matrix.build_tests }}
      - name: Build (Release)
        if: ${{ matrix.run_build && !matrix.install_dependencies_manually && contains(matrix.build_types, 'Release') }}
        uses: ./.github/workflows/actions/conan/build
        with:
          build_type: Release
          build_tests: ${{ matrix.build_tests }}
          extra_conan_flags: ${{ matrix.extra_conan_flags}}
      - name: Install dependencies (RelWithDebInfo)
        if: ${{ !matrix.install_dependencies_manually && contains(matrix.build_types, 'RelWithDebInfo') }}
        uses: ./.github/workflows/actions/conan/install_dependencies
        with:
          build_type: RelWithDebInfo
          build_tests: ${{ matrix.build_tests }}
      - name: Build (RelWithDebInfo)
        if: ${{ matrix.run_build && !matrix.install_dependencies_manually && contains(matrix.build_types, 'RelWithDebInfo') }}
        uses: ./.github/workflows/actions/conan/build
        with:
          build_type: RelWithDebInfo
          build_tests: ${{ matrix.build_tests }}
          extra_conan_flags: ${{ matrix.extra_conan_flags}}
      - name: Build (with local dependencies)
        # Only the "Local dependencies" configuration takes this path, and it
        # names a single build type.
        if: ${{ matrix.run_build && matrix.install_dependencies_manually }}
        shell: bash
        run: |
          set -v
          set -e
          mkdir build
          mkdir build/${{matrix.build_types}}
          cd build/${{matrix.build_types}}
          cmake -G Ninja ../.. -DCMAKE_BUILD_TYPE=${{matrix.build_types}} -DBUILD_TESTING=True -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=${{matrix.compiler.cxx}} -DCMAKE_C_COMPILER=${{matrix.compiler.cc}}
          ninja
      - name: Run clang-tidy
        id: clang_tidy
        if: ${{ matrix.run_clang_tidy }}
        shell: bash
        run: |
          set -v
          set -e
          if ! ./run-clang-tidy.sh -fix ; then
            git diff > /tmp/clang-tidy-fixes
            echo Found clang tidy fixes:
            cat /tmp/clang-tidy-fixes
            exit 1
          else
            echo Did not find any clang-tidy fixes
          fi
      - name: Upload fixes as artifact
        if: ${{ always() && matrix.run_clang_tidy }}
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-fixes
          path: /tmp/clang-tidy-fixes
          if-no-files-found: ignore
      - name: Save ccache
        uses: ./.github/workflows/actions/ccache/cache
        with:
          action: 'save'
          ccache_dir: ${{github.workspace}}/.ccache
          cache_key: v4-${{ runner.os }}-${{ matrix.os }}-ccache__${{matrix.compiler.compiler}}__${{matrix.compiler.version}}__${{steps.build_types.outputs.slug}}__${{matrix.run_build}}__${{matrix.install_dependencies_manually}}__${{matrix.run_clang_tidy}}__${{steps.hash_flags.outputs.hash_flags}}__
          secret_aws_access_key_id: ${{ secrets.CACHE_AWS_ACCESS_KEY_ID }}
          secret_aws_secret_access_key: ${{ secrets.CACHE_AWS_SECRET_ACCESS_KEY }}
      - name: Save conan cache
        uses: ./.github/workflows/actions/conan/cache
        with:
          action: save
          secret_aws_access_key_id: ${{ secrets.CACHE_AWS_ACCESS_KEY_ID }}
          secret_aws_secret_access_key: ${{ secrets.CACHE_AWS_SECRET_ACCESS_KEY }}
          cache_key: v11-${{ runner.os }}-${{ matrix.os }}-conancache__${{matrix.compiler.compiler}}__${{matrix.compiler.version}}__${{steps.build_types.outputs.slug}}__${{matrix.install_dependencies_manually}}__${{steps.hash_flags.outputs.hash_flags}}__
      - name: EXPLORE macOS FUSE backends
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        continue-on-error: true
        run: |
          set -x
          sw_vers
          uname -m
          id
          ls -la /Library/Filesystems/ || true
          ls -la /Library/Filesystems/macfuse.fs/Contents/ || true
          grep -A1 -E "CFBundleShortVersionString|CFBundleVersion" /Library/Filesystems/macfuse.fs/Contents/Info.plist || true
          ls -la /usr/local/lib/ | grep -i fuse || true
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --modversion fuse3 || true
          kmutil showloaded 2>&1 | grep -i fuse || echo "EXPLORE: no fuse kext loaded"
          ls -la /dev/ | grep -i fuse || echo "EXPLORE: no /dev/*fuse* devices"
          ls -la /Volumes/
          pluginkit -m -v -A 2>&1 | grep -i fuse || echo "EXPLORE: pluginkit does not list a macfuse extension"
          ls -la /Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/Extensions/ || true
          sudo pluginkit -v -a /Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/Extensions/macfuse.appex/ || true
          pluginkit -m -v -A 2>&1 | grep -i fuse || echo "EXPLORE: pluginkit still does not list a macfuse extension"
          ls -la /Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/MacOS/ || true
          /Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/MacOS/macfuse --help 2>&1 | head -50 || true
          /Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/MacOS/macfuse status 2>&1 | head -50 || true

          CRYFS=build/Release/src/cryfs-cli/cryfs
          UNMOUNT=build/Release/src/cryfs-unmount/cryfs-unmount
          ls -la "$CRYFS" "$UNMOUNT"
          export CRYFS_FRONTEND=noninteractive CRYFS_NO_UPDATE_CHECK=true
          probe() {
            local name=$1 mountdir=$2; shift 2
            local base=/tmp/probe-$name-base
            mkdir -p "$base"
            echo "=== EXPLORE probe $name: mountdir=$mountdir extra args: $*"
            ( echo pass | gtimeout 120 "$CRYFS" "$base" "$mountdir" -f --cipher aes-256-gcm "$@" ; echo "cryfs exit code: $?" ) > /tmp/probe-$name.log 2>&1 &
            local pid=$!
            for i in $(seq 1 30); do
              if mount | grep -q "$mountdir"; then break; fi
              sleep 1
            done
            mount | grep "$mountdir" || echo "EXPLORE: $name not mounted after 30s"
            ls -la "$mountdir" || true
            echo hello > "$mountdir/testfile" || echo "EXPLORE: $name write failed"
            cat "$mountdir/testfile" || echo "EXPLORE: $name read failed"
            ls -la "$mountdir" || true
            stat "$mountdir/testfile" || true
            "$UNMOUNT" "$mountdir" || echo "EXPLORE: $name cryfs-unmount failed"
            sleep 3
            if mount | grep -q "$mountdir"; then
              echo "EXPLORE: $name still mounted after cryfs-unmount; trying umount"
              umount "$mountdir" || echo "EXPLORE: $name umount failed"
              sleep 2
            fi
            if mount | grep -q "$mountdir"; then
              echo "EXPLORE: $name still mounted after umount; trying diskutil unmount"
              diskutil unmount "$mountdir" || diskutil unmount force "$mountdir" || echo "EXPLORE: $name diskutil unmount failed"
              sleep 2
            fi
            mount | grep "$mountdir" && echo "EXPLORE: $name STILL mounted" || echo "EXPLORE: $name is unmounted now"
            wait $pid || true
            echo "--- cryfs log for $name:"; cat /tmp/probe-$name.log
          }
          mkdir -p /tmp/probe-kext-mount
          probe kext /tmp/probe-kext-mount
          sudo mkdir -p /Volumes/cryfsprobe && sudo chown "$(id -u)" /Volumes/cryfsprobe
          probe fskit /Volumes/cryfsprobe -o backend=fskit
          mkdir -p /tmp/probe-fskit2-mount
          probe fskit2 /tmp/probe-fskit2-mount -o backend=fskit
          sudo chmod a+w /Volumes || true
          probe fskit3 /Volumes/cryfsprobe3 -o backend=fskit --create-missing-mountpoint
          ls -la /Volumes/
          mount
      - name: EXPLORE fspp-test and cryfs-cli-test on macOS (Release)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        continue-on-error: true
        run: |
          cd build/Release/test
          gtimeout 1500 ./fspp/fspp-test > /tmp/fspp-test.log 2>&1 || echo "EXPLORE: fspp-test exit $?"
          grep -E "^\[  (PASSED|FAILED|  SKIPPED)|^\[==========\]|Assertion|exited before|Timeout" /tmp/fspp-test.log | head -300
          echo "::group::fspp-test full log"
          cat /tmp/fspp-test.log || true
          echo "::endgroup::"
          ./cryfs-cli/cryfs-cli-test --gtest_list_tests > /tmp/tests.txt
          tests=$(awk '/^[^ ]/ {suite=$1} /^  / {sub(/^  /,""); split($0,a,"#"); gsub(/ +$/,"",a[1]); print suite a[1]}' /tmp/tests.txt)
          echo "$tests" | wc -l
          pass=0; fail=0; skip=0
          for t in $tests; do
            start=$(date +%s)
            rc=0
            rm -f /tmp/trace.log
            CRYFS_TEST_TRACE_FILE=/tmp/trace.log gtimeout 120 ./cryfs-cli/cryfs-cli-test --gtest_filter="$t" > /tmp/one.log 2>&1 || rc=$?
            end=$(date +%s)
            if [ $rc -eq 0 ]; then
              if grep -q "SKIPPED" /tmp/one.log; then skip=$((skip+1)); echo "SKIP ($((end-start))s) $t: $(grep -A1 'SKIPPED' /tmp/one.log | head -2 | tr '\n' ' ')"; else pass=$((pass+1)); echo "PASS ($((end-start))s) $t"; fi
            else
              fail=$((fail+1))
              echo "FAIL rc=$rc ($((end-start))s) $t"
              echo "::group::log of $t"
              cat /tmp/one.log
              echo "--- harness trace:"
              cat /tmp/trace.log || true
              echo "::endgroup::"
            fi
          done
          echo "EXPLORE: cryfs-cli-test pass=$pass fail=$fail skip=$skip"
      - name: Test (Debug)
        if: ${{ matrix.run_tests && contains(matrix.build_types, 'Debug') }}
        uses: ./.github/workflows/actions/run_tests
        with:
          build_type: Debug
          gtest_args: ${{matrix.gtest_args}}
          extra_env_vars: ${{matrix.extra_env_vars_for_test}}
      - name: Test (Release)
        if: ${{ matrix.run_tests && contains(matrix.build_types, 'Release') }}
        uses: ./.github/workflows/actions/run_tests
        with:
          build_type: Release
          gtest_args: ${{matrix.gtest_args}}
          extra_env_vars: ${{matrix.extra_env_vars_for_test}}
      - name: Test (RelWithDebInfo)
        if: ${{ matrix.run_tests && contains(matrix.build_types, 'RelWithDebInfo') }}
        uses: ./.github/workflows/actions/run_tests
        with:
          build_type: RelWithDebInfo
          gtest_args: ${{matrix.gtest_args}}
          extra_env_vars: ${{matrix.extra_env_vars_for_test}}
      - name: CPack (Debug)
        if: ${{ matrix.run_cpack && contains(matrix.build_types, 'Debug') }}
        uses: ./.github/workflows/actions/cpack
        with:
          build_type: Debug
      - name: CPack (Release)
        if: ${{ matrix.run_cpack && contains(matrix.build_types, 'Release') }}
        uses: ./.github/workflows/actions/cpack
        with:
          build_type: Release
      - name: CPack (RelWithDebInfo)
        if: ${{ matrix.run_cpack && contains(matrix.build_types, 'RelWithDebInfo') }}
        uses: ./.github/workflows/actions/cpack
        with:
          build_type: RelWithDebInfo

  windows:
    name: CI
    needs: should_run
    if: needs.should_run.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        name: [""]
        os:
          - windows-2022
          - windows-2025
        build_type:
          - Release
          - RelWithDebInfo
    runs-on: ${{matrix.os}}
    env:
      # Setting conan cache dir to a location where our Github Cache Action can find it
      CONAN_HOME: "D:/.conan/"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch all history because we need that to determine our version number
          fetch-depth: 0
      #TODO Ideally, all the setup actions would be in their own subaction, but Github doesn't support using third party actions (e.g. cache) from nested actions yet, see https://github.com/actions/runner/issues/862
      - name: Setup Windows
        uses: ./.github/workflows/actions/setup_windows
      - name: Get ccache dir
        id: ccache_dir
        shell: bash
        run: |
          # Windows CI has backwards slashes in github.workspace, so we need to convert that to forward slashes
          CCACHE_DIR="${{github.workspace}}/.ccache"
          echo "ccache_dir=${CCACHE_DIR//\\//}" >> $GITHUB_OUTPUT
      - name: Setup ccache
        uses: ./.github/workflows/actions/ccache/setup
        with:
          ccache_dir: ${{steps.ccache_dir.outputs.ccache_dir}}
          cache_key: v2-${{ runner.os }}-${{ matrix.os }}-ccache__${{matrix.build_type}}__
      # TODO Ideally, the Setup conan cache step would be part of the build action, but Github doesn't support nested actions yet, see https://github.com/actions/runner/issues/862
      - name: Restore conan cache
        uses: ./.github/workflows/actions/conan/cache
        with:
          action: load
          cache_key: v10-${{ runner.os }}-${{ matrix.os }}-conancache__${{matrix.build_type}}__
      # Setup conan is after restoring the conan cache so that the cache doesn't overwrite the conan profile
      - name: Setup conan
        uses: ./.github/workflows/actions/conan/setup
        with:
          arch: "x86_64"
          compiler: "msvc"
          # windows-2022 ships Visual Studio 2022, which conan calls msvc 194 (toolset v143).
          # windows-2025 ships Visual Studio 2026, which conan calls msvc 195 (toolset v145).
          compiler_version: ${{ matrix.os == 'windows-2025' && '195' || '194' }}
          build_type: ${{ matrix.build_type }}
      - name: Install dependencies
        uses: ./.github/workflows/actions/conan/install_dependencies
        with:
          build_type: ${{ matrix.build_type }}
          build_tests: "True"
      - name: Build
        uses: ./.github/workflows/actions/conan/build
        with:
          build_type: ${{ matrix.build_type }}
          build_tests: "True"
          extra_conan_flags: "-o '&:windows_dokany_path=C:/Program Files/Dokan/DokanLibrary-2.3.1'"
      - name: Save ccache
        uses: ./.github/workflows/actions/ccache/cache
        with:
          action: 'save'
          ccache_dir: ${{steps.ccache_dir.outputs.ccache_dir}}
          cache_key: v2-${{ runner.os }}-${{ matrix.os }}-ccache__${{matrix.build_type}}__
          secret_aws_access_key_id: ${{ secrets.CACHE_AWS_ACCESS_KEY_ID }}
          secret_aws_secret_access_key: ${{ secrets.CACHE_AWS_SECRET_ACCESS_KEY }}
      - name: Save conan cache
        uses: ./.github/workflows/actions/conan/cache
        with:
          action: save
          secret_aws_access_key_id: ${{ secrets.CACHE_AWS_ACCESS_KEY_ID }}
          secret_aws_secret_access_key: ${{ secrets.CACHE_AWS_SECRET_ACCESS_KEY }}
          cache_key: v10-${{ runner.os }}-${{ matrix.os }}-conancache__${{matrix.build_type}}__
      - name: EXPLORE Dokany and a cryfs mount on Windows
        shell: bash
        continue-on-error: true
        run: |
          set -x
          sc query dokan2 || true
          sc query dokan1 || true
          fltmc filters || true
          ls "C:/Program Files/Dokan/" || true
          ls "C:/Program Files/Dokan/DokanLibrary-2.3.1/" || true
          ls "C:/Windows/System32/drivers/" | grep -i dokan || true
          CRYFS=build/${{matrix.build_type}}/src/cryfs-cli/cryfs.exe
          UNMOUNT=build/${{matrix.build_type}}/src/cryfs-unmount/cryfs-unmount.exe
          ls -la "$CRYFS" "$UNMOUNT"
          export CRYFS_FRONTEND=noninteractive CRYFS_NO_UPDATE_CHECK=true
          BASE="$(cygpath -w "$RUNNER_TEMP")\\probe-base"
          mkdir -p "$BASE"
          ( echo pass | timeout 120 "$CRYFS" "$BASE" "X:" -f --cipher aes-256-gcm ; echo "cryfs exit code: $?" ) > "$RUNNER_TEMP/probe.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do if [ -d /x/ ]; then break; fi; sleep 1; done
          ls -la /x/ || echo "EXPLORE: X: not accessible after 30s"
          echo hello > /x/testfile || echo "EXPLORE: write failed"
          cat /x/testfile || echo "EXPLORE: read failed"
          ls -la /x/ || true
          "$UNMOUNT" "X:" || echo "EXPLORE: cryfs-unmount failed"
          sleep 3
          ls /x/ && echo "EXPLORE: X: still there after cryfs-unmount" || echo "EXPLORE: X: is gone now"
          wait $pid || true
          echo "--- cryfs log:"; cat "$RUNNER_TEMP/probe.log"
          echo "=== EXPLORE probe 2: unmount right after the mount"
          BASE2="$(cygpath -w "$RUNNER_TEMP")\\probe-base2"
          mkdir -p "$BASE2"
          ( echo pass | timeout 120 "$CRYFS" "$BASE2" "Y:" -f --cipher aes-256-gcm ; echo "cryfs exit code: $?" ) > "$RUNNER_TEMP/probe2.log" 2>&1 &
          pid=$!
          for i in $(seq 1 200); do
            if "$UNMOUNT" "Y:" > "$RUNNER_TEMP/unmount.log" 2>&1; then
              echo "EXPLORE: unmount attempt $i succeeded at $(date +%T)"
              break
            else
              echo "EXPLORE: unmount attempt $i failed at $(date +%T): $(tr '\n' ' ' < "$RUNNER_TEMP/unmount.log" | cut -c1-200)"
            fi
            sleep 0.1
          done
          wait $pid || true
          echo "--- cryfs log 2:"; cat "$RUNNER_TEMP/probe2.log"
      - name: EXPLORE cryfs-cli-test on Windows, one process per test
        shell: bash
        continue-on-error: true
        run: |
          cd build/${{matrix.build_type}}/test
          timeout 600 ./fspp/fspp-test.exe 2>&1 | tail -3
          echo "EXPLORE: fspp-test exit ${PIPESTATUS[0]}"
          ./cryfs-cli/cryfs-cli-test.exe --gtest_list_tests > "$RUNNER_TEMP/tests.txt"
          tests=$(awk '/^[^ ]/ {suite=$1} /^  / {sub(/^  /,""); split($0,a,"#"); gsub(/ +$/,"",a[1]); print suite a[1]}' "$RUNNER_TEMP/tests.txt")
          echo "$tests" | wc -l
          pass=0; fail=0; skip=0
          for t in $tests; do
            start=$(date +%s)
            rc=0
            rm -f "$RUNNER_TEMP/trace.log"
            CRYFS_TEST_TRACE_FILE="$RUNNER_TEMP/trace.log" timeout 120 ./cryfs-cli/cryfs-cli-test.exe --gtest_filter="$t" > "$RUNNER_TEMP/one.log" 2>&1 || rc=$?
            end=$(date +%s)
            if [ $rc -eq 0 ]; then
              if grep -q "SKIPPED" "$RUNNER_TEMP/one.log"; then skip=$((skip+1)); echo "SKIP ($((end-start))s) $t: $(grep -A1 'SKIPPED' "$RUNNER_TEMP/one.log" | head -2 | tr '\n' ' ')"; else pass=$((pass+1)); echo "PASS ($((end-start))s) $t"; fi
            else
              fail=$((fail+1))
              echo "FAIL rc=$rc ($((end-start))s) $t"
              echo "::group::log of $t"
              cat "$RUNNER_TEMP/one.log"
              echo "--- harness trace:"
              cat "$RUNNER_TEMP/trace.log" || true
              echo "::endgroup::"
            fi
          done
          echo "EXPLORE: cryfs-cli-test pass=$pass fail=$fail skip=$skip"
      - name: CPack
        uses: ./.github/workflows/actions/cpack
        # Release installers are built with Visual Studio 2026, which windows-2025 ships.
        if: ${{ matrix.os == 'windows-2025' }}
        with:
          build_type: ${{matrix.build_type}}
