name: 'Test'
description: 'Run CryFS Tests'
inputs:
  build_type:
    description: "Which cmake build type was used to build (e.g. Release, Debug, RelWithDebInfo)"
    required: true
  gtest_args:
    description: "Extra arguments for gtest runners, for example tests to exclude"
    required: true
  extra_env_vars:
    description: "Extra environment variables to set before running tests"
    required: true
runs:
  using: "composite"
  steps:
    - name: Run tests
      shell: bash
      # The test binaries are independent of each other, so they run at the
      # same time, each into its own log. The logs are printed once all of
      # them have finished, in the order the binaries used to run in, each in
      # its own group, so the job log reads as before. A failure in any
      # binary fails the step after every log has been printed.
      run: |
        set -v
        set -e
        # Job control is on so that the background test binaries below keep the
        # default SIGINT and SIGQUIT handling. Without it, bash starts
        # asynchronous commands with both signals ignored, which the death
        # tests in cpp-utils-test that raise SIGINT on themselves and expect
        # to die then fail.
        set -m
        echo Running on ${{runner.os}}
        cd build/${{inputs.build_type}}/test

        export ${{ inputs.extra_env_vars }}

        tests=(
          gitversion/gitversion-test
          cpp-utils/cpp-utils-test
          parallelaccessstore/parallelaccessstore-test
          blockstore/blockstore-test
          blobstore/blobstore-test
          cryfs/cryfs-test
        )
        # TODO Also run with TSAN once fixed
        if [[ "${{matrix.name}}" != "TSAN" ]]; then
          tests+=(fspp/fspp-test)
        fi
        tests+=(cryfs-cli/cryfs-cli-test)
        if [[ "${{runner.os}}" == "macOS" ]]; then
          # GitHub's macOS runners can't load the macFUSE kernel extension: a user has to approve
          # it and reboot, and Apple Silicon needs Reduced Security on top. So nothing can be
          # mounted on them. The tests that need a mounted file system skip when this is set (see
          # test/my-gtest-main/mount_availability.h), everything else in fspp-test and
          # cryfs-cli-test runs.
          export CRYFS_TEST_CANNOT_MOUNT=1
        fi

        logdir=$(mktemp -d)
        pids=()
        for t in "${tests[@]}"; do
          "./$t" ${{inputs.gtest_args}} > "$logdir/$(basename "$t").log" 2>&1 &
          pids+=($!)
        done
        failed=()
        for i in "${!tests[@]}"; do
          if wait "${pids[$i]}"; then
            status=passed
          else
            status=FAILED
            failed+=("${tests[$i]}")
          fi
          echo "::group::${tests[$i]} ($status)"
          cat "$logdir/$(basename "${tests[$i]}").log"
          echo "::endgroup::"
        done
        if (( ${#failed[@]} > 0 )); then
          echo "Failed test binaries: ${failed[*]}"
          exit 1
        fi
