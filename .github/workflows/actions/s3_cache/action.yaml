name: 'S3 Cache'
description: 'S3 Cache'
inputs:
  action:
    description: "`load` or `save` the cache"
    required: true
  paths:
    description: "Directory paths to cache"
    required: true
  cache_key:
    description: "Cache key"
    required: true
  secret_aws_access_key_id:
    description: "AWS access key ID"
    required: false
  secret_aws_secret_access_key:
    description: "AWS secret access key"
    required: false
runs:
  using: "composite"
  steps:
    # Saving needs the write-capable key, which the workflow passes in from
    # the repository secrets. GitHub gives those to push runs and to pull
    # request runs whose head branch is in this repository, and withholds
    # them from pull requests coming from forks, so the condition below
    # matches exactly the runs that can save. Pull request runs used to be
    # excluded altogether; since a push to a branch with an open pull request
    # no longer gets a run of its own, they are now the only runs that can
    # refresh the caches while a dependency change is under review.
    - name: Zip cache files
      if: ${{ inputs.action == 'save' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
      shell: bash
      run: |
        set -e
        set -v
        mkdir -p "/tmp/s3_cache/${{inputs.cache_key}}"
        tar --zstd --create -Pp --same-owner --file "/tmp/s3_cache/${{inputs.cache_key}}/cache.tar.zstd" ${{ inputs.paths }}
        echo "Zipped cache:"
        ls -lh "/tmp/s3_cache/${{inputs.cache_key}}"
    - name: Store cache
      # note: this access key has write access to the cache. See above for which runs have it.
      if: ${{ inputs.action == 'save' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
      # Cache things sometimes indeterministically fail (roughly 1% of times this is run), let's not fail the job for it
      continue-on-error: true
      uses: leroy-merlin-br/action-s3-cache@7fad0a81b31884660211f24b62e29b4777a6ac4c # v1.0.6
      with:
        action: put
        aws-access-key-id: ${{ inputs.secret_aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.secret_aws_secret_access_key }}
        aws-region: eu-west-1
        bucket: ci-cache.cryfs
        s3-class: ONEZONE_IA
        key: v2-${{ inputs.cache_key }}
        artifacts: "/tmp/s3_cache/${{inputs.cache_key}}"
    - name: Not saving cache on pull requests from forks
      if: ${{ inputs.action == 'save' && !(github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
      shell: bash
      run: |
        echo "Not saving cache because this is a pull request from a fork"


    - name: Retrieve cache
      if: ${{ inputs.action == 'load' }}
      # Many jobs access the cache in parallel an we might observe an incomplete state that isn't valid. This would fail with a checksum error. Let's not fail the CI job but continue it, later on this job will upload a new new cache as part of the regular job run.
      continue-on-error: true
      # We're using an S3 based cache because the standard GitHub Action cache (actions/cache) only gives us 5GB of storage and we need more
      uses: leroy-merlin-br/action-s3-cache@7fad0a81b31884660211f24b62e29b4777a6ac4c # v1.0.6
      with:
        action: get
        # note: this access key has read-only access to the cache. It's public so it runs on PRs.
        aws-access-key-id: AKIAV5S2KH4F5OUZXV5E
        aws-secret-access-key: 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
        aws-region: eu-west-1
        bucket: ci-cache.cryfs
        key: v2-${{ inputs.cache_key }}
    - name: Unzip cache files
      if: ${{ inputs.action == 'load' }}
      # continue-on-error is what makes a broken cache survivable: the job goes on without
      # one and rebuilds from scratch, and if it gets that far it uploads a fresh archive.
      # But that only holds if a failed load really leaves nothing behind. tar writes as it
      # reads, so an archive that arrives truncated or corrupted restores some of the paths
      # and not the rest, and with `set -e` plus continue-on-error that partial state was
      # kept and the step still counted as done. The job then ran against a cache directory
      # that was neither empty nor complete, which is worse than having no cache: it is the
      # one state nothing downstream is written to expect, and whatever it breaks breaks far
      # from here, with an error that doesn't mention the cache.
      #
      # So look at what tar returned instead of letting continue-on-error swallow it, and
      # delete what was extracted. Both callers pass a directory that exists only to hold
      # this cache - conan's CONAN_HOME (restored before `Setup conan` writes the profile
      # into it) and ccache's dir - so there is nothing else in them to lose, and the job
      # carries on down the "no cache" path that already works.
      continue-on-error: true
      shell: bash
      run: |
        set -v
        CACHE_PATHS="${{ inputs.paths }}"
        if [ ! -f "/tmp/s3_cache/${{inputs.cache_key}}/cache.tar.zstd" ]; then
          echo "Warning: Cache not found"
          exit 0
        fi
        echo "Zipped cache:"
        ls -lh "/tmp/s3_cache/${{inputs.cache_key}}"
        if ! tar --extract --zstd -Pp --same-owner --file "/tmp/s3_cache/${{inputs.cache_key}}/cache.tar.zstd" $CACHE_PATHS; then
          echo "Warning: the cache archive did not extract cleanly. Discarding what was extracted and continuing without a cache."
          if [ -n "$CACHE_PATHS" ]; then
            rm -rf $CACHE_PATHS
          fi
        fi
