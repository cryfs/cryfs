[package]
name = "cryfs-cli"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true

[[bin]]
name = "cryfs"

[dependencies]
anyhow.workspace = true
atomic-time.workspace = true
byte-unit.workspace = true
color-print.workspace = true
clap = { workspace = true, features = ["derive"] }
# serde: the daemon's logging config travels inside the mount `Request` over the
# RPC channel (the re-exec'd daemon has empty argv and can't re-parse `--log`),
# so `LoggingConfig` must be Serialize/Deserialize here.
clap-logflag = { workspace = true, features = ["serde"] }
# TODO Go through all of our crates and minimize inter-crate dependencies
cryfs-blobstore = { path = "../blobstore" }
cryfs-blockstore = { path = "../blockstore" }
cryfs-cli-utils = { path = "../cli-utils" }
cryfs-crypto = { path = "../crypto" }
cryfs-config = { path = "../cryfs-config" }
cryfs-filesystem = { path = "../cryfs-filesystem" }
cryfs-rustfs = { path = "../rustfs", default-features = false, features = ["fuser"] }
cryfs-utils = { path = "../utils" }
cryfs-version = { path = "../cryfs-version" }
daemonizable.workspace = true
dialoguer.workspace = true
humantime.workspace = true
itertools.workspace = true
log.workspace = true
once_cell.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
console-subscriber = {workspace = true, optional = true}


[dev-dependencies]
assert_cmd.workspace = true
daemonizable = { workspace = true, features = ["testutils"] }
escargot.workspace = true
lazy_static.workspace = true
predicates.workspace = true
rstest.workspace = true

[features]
default = ["check_for_updates"]
check_for_updates = ["cryfs-cli-utils/check_for_updates"]
tokio_console = ["dep:console-subscriber"]
