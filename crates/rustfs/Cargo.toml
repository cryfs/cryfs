[package]
name = "cryfs-rustfs"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
cryfs-utils = { path = "../utils" }
cryfs-version = { path = "../cryfs-version" }
derive_more.workspace = true
fuse_mt = { workspace = true, optional = true }
# The `fuse_mt` crate is still on fuser 0.16, so the fuse_mt backend mounts via a second fuser pinned to
# 0.16 and aliased as `fuser_fusemt` (the main `fuser` dependency below is 0.17). Use "0.16" (NOT "=0.16.0")
# so it resolves to the SAME fuser-0.16 version `fuse_mt` does and cargo unifies them into one crate
# instance — otherwise `FuseMT` (which implements fuser-0.16's `Filesystem`) wouldn't satisfy
# `fuser_fusemt::spawn_mount2`. Only pulled in when the `fuse_mt` feature is enabled.
fuser_fusemt = { package = "fuser", version = "0.16", optional = true }
# TODO Make fuser dependency optional and only include it if the "fuser" feature is enabled (here and below in the macos setup).
fuser.workspace = true
futures.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true  
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
lockable.workspace = true
itertools.workspace = true
time = {workspace = true, features = ["formatting"]}
cryfs-concurrent-store = { path = "../concurrent-store" }

[dev-dependencies]
rstest.workspace = true
rstest_reuse.workspace = true
tokio = { workspace = true, features = ["fs"] }
# TODO env_logger and nix are only needed for the passthrough example
env_logger.workspace = true
nix = { workspace = true, features = ["fs", "user", "uio"] }
mockall.workspace = true
tempfile.workspace = true
cryfs-utils = { path = "../utils", features = ["testutils"] }
users.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Unlike fuser 0.17, fuser 0.16 (`fuser_fusemt`, used by the fuse_mt backend) `unimplemented!()`s in its
# build.rs when built without the `libfuse` feature on a non-Linux target — so on macOS it MUST link
# libfuse (macFUSE). (The main fuser 0.17 dep needs no such feature; its build.rs forces libfuse2 on
# macOS unconditionally.) On Linux, `fuser_fusemt` stays featureless (pure-rust) via the base dep above.
# Only relevant when the `fuse_mt` feature is enabled.
fuser_fusemt = { package = "fuser", version = "0.16", optional = true, features = ["libfuse"] }

[features]
default = ["fuser"]
fuse_mt = ["dep:fuse_mt", "dep:fuser_fusemt"]
fuser = []
testutils = ["cryfs-utils/testutils", "cryfs-concurrent-store/testutils"]

[[example]]
name = "inmemory"
required-features = ["fuser"]

[[example]]
name = "passthrough"
required-features = ["fuser"]
