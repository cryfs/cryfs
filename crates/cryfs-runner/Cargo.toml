[package]
name = "cryfs-runner"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
atomic-time.workspace = true
# serde: the daemon's logging config now travels inside `Request` over the RPC
# channel (the re-exec'd daemon has empty argv and can't re-parse `--log`), so
# `LoggingConfig` must be Serialize/Deserialize here.
clap-logflag = { workspace = true, features = ["serde"] }
cryfs-cli-utils = { path = "../cli-utils" }
cryfs-filesystem = { path = "../cryfs-filesystem" }
cryfs-config = { path = "../cryfs-config" }
cryfs-rustfs = { path = "../rustfs", default-features=false, features=["fuser"]}
cryfs-blobstore = { path = "../blobstore" }
cryfs-blockstore = { path = "../blockstore" }
cryfs-utils = { path = "../utils" }
cryfs-version = { path = "../cryfs-version" }
daemonizable.workspace = true
tokio.workspace = true
log.workspace = true
serde.workspace = true
tokio-util.workspace = true

[dev-dependencies]
byte-unit.workspace = true
daemonizable = { workspace = true, features = ["testutils"] }
